services:
  # Le service de l'application Laravel
  app:
    build:
      context: ../
      dockerfile: deploy/Dockerfile
    image: shlarsite-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ../:/var/www
    depends_on:
      db:
        condition: service_healthy
    networks:
      - shlarsite-network

  # Le serveur Web (Nginx)
  webserver:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ../:/var/www
      - ./nginx:/etc/nginx/conf.d/
    depends_on:
      - app
    networks:
      - shlarsite-network

  # La base de données PostgreSQL
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-shlarsite}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-shlarsite}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shlarsite-network

networks:
  shlarsite-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
